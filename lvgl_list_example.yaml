esphome:
  name: lvgl-list-example

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

display:
  - platform: ili9341
    id: display1
    cs_pin: GPIO10
    dc_pin: GPIO14
    spi_id: spi_bus

spi:
  - id: spi_bus
    clk_pin: GPIO12
    mosi_pin: GPIO11

lvgl:
  id: lvgl_main
  default_font: roboto_28
  displays: [display1]
  widgets:
    # 基础列表示例
    - list:
        id: my_list
        x: 10
        y: 10
        width: 300
        height: 200
        items:
          # 按钮类型项目
          - text: "Home"
            list_button: {}
          - text: "Settings"
            list_button: {}
          - text: "About"
            list_button: {}

    # 混合列表示例 (带文本标题)
    - list:
        id: mixed_list
        x: 10
        y: 220
        width: 300
        height: 200
        items:
          # 文本标题项
          - text: "Menu Section"
            list_text: {}
          # 按钮项
          - text: "Option 1"
            list_button: {}
          - text: "Option 2"
            list_button: {}
          # 另一个文本标题
          - text: "Settings"
            list_text: {}
          - text: "Network"
            list_button: {}
          - text: "Display"
            list_button: {}

    # 带样式的列表示例
    - list:
        id: styled_list
        x: 320
        y: 10
        width: 300
        height: 410
        items:
          - text: "Styled Item 1"
            list_button:
              main:
                border_color: 0xFF0000
                border_width: 2
          - text: "Styled Item 2"
            list_button:
              main:
                bg_color: 0x0066FF
          - text: "Section Header"
            list_text:
              main:
                text_color: 0xFFFF00
          - text: "Styled Item 3"
            list_button:
              main:
                bg_color: 0x00FF00

font:
  - file: "gfonts://Roboto"
    id: roboto_28
    size: 28
